# SPDX-License-Identifier: GPL-2.0-or-later
name: PC-88VA compile target structure

on:
  push:
    branches:
      - necpc88va
    paths:
      - "pc88va/**"
      - ".github/workflows/pc88va-compile.yml"
  pull_request:
    paths:
      - "pc88va/**"
      - ".github/workflows/pc88va-compile.yml"

jobs:
  structure:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out fdkernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate independent compile target structure
        run: |
          git diff --check
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pc88va-pycache" python3 -m compileall -q pc88va/tools pc88va/tests
          python3 -m unittest discover -s pc88va/tests -p 'test_*.py'
          test -z "$(git status --short --untracked-files=all)"
